[project]
name = "serviceflow-agent-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "mcp>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "pillow>=10,<12",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "paramiko>=3.5,<5",
    "python-pptx>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.63,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
